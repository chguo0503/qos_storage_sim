<title id="math_integral_title">曲线下的面积，就是实际读出的总量（教学示意）</title>
<desc id="math_integral_desc">盘能力为每秒10份。0到2秒实际每秒6份，2到3秒为0，3到5秒实际每秒9份。紫色面积为6乘2加0乘1加9乘2等于30份；能力上界为10乘5等于50份。 非仿真或实测结果。</desc>
