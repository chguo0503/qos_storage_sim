<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="math-weights" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="math_weights_title math_weights_desc">
<title id="math_weights_title">不同画像，先各自换算，再相加（教学示意）</title>
<desc id="math_weights_desc">固定画像甲每层读取20份并计算10秒，速率2份每秒；两层读40份，换算得40除以2等于20卡秒。画像乙每层读取100份并计算10秒，速率10份每秒；两层读200份，换算得200除以10等于20卡秒。两路合并计算工作量40卡秒；应使用不同权重1/2和1/10。 非仿真或实测结果。</desc>
<style>svg.math-weights text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect x="0" y="0" width="1000" height="330" rx="0" fill="white" stroke="none" stroke-width="1.2"/><text x="25" y="31" font-size="25" fill="#17283d" text-anchor="start" font-weight="bold">不同画像，先各自换算，再相加</text><text x="974" y="30" font-size="19" fill="#657389" text-anchor="end" font-weight="normal">教学示意</text><rect x="25" y="58" width="307" height="103" rx="8" fill="#f4edff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="178" y="87" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="normal">画像甲：r=2份/秒</text>
<text x="178" y="118" font-size="20" fill="#17283d" text-anchor="middle" font-weight="normal">每层读20份，算10秒</text>
<text x="178" y="147" font-size="20" fill="#17283d" text-anchor="middle" font-weight="normal">共2层：实际读出40份</text>
<path d="M 342 110 H 374" fill="none" stroke="#657389" stroke-width="2"/>
<path d="M 374 110 L 366 105 L 366 115 Z" fill="#657389"/>
<rect x="384" y="69" width="246" height="81" rx="8" fill="#f4edff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="507" y="100" font-size="21" fill="#7c3aed" text-anchor="middle" font-weight="normal">40份 ÷ 2份/秒</text>
<text x="507" y="132" font-size="25" fill="#7c3aed" text-anchor="middle" font-weight="normal">=20卡·秒</text>
<rect x="25" y="185" width="307" height="103" rx="8" fill="#fff2e3" stroke="#df8426" stroke-width="1.2"/>
<text x="178" y="214" font-size="22" fill="#df8426" text-anchor="middle" font-weight="normal">画像乙：r=10份/秒</text>
<text x="178" y="245" font-size="20" fill="#17283d" text-anchor="middle" font-weight="normal">每层读100份，算10秒</text>
<text x="178" y="274" font-size="20" fill="#17283d" text-anchor="middle" font-weight="normal">共2层：实际读出200份</text>
<path d="M 342 237 H 374" fill="none" stroke="#657389" stroke-width="2"/>
<path d="M 374 237 L 366 232 L 366 242 Z" fill="#657389"/>
<rect x="384" y="196" width="246" height="81" rx="8" fill="#fff2e3" stroke="#df8426" stroke-width="1.2"/>
<text x="507" y="227" font-size="21" fill="#df8426" text-anchor="middle" font-weight="normal">200份 ÷ 10份/秒</text>
<text x="507" y="259" font-size="25" fill="#df8426" text-anchor="middle" font-weight="normal">=20卡·秒</text>
<path d="M 642 110 H 679 L 710 174 H 735 M 642 237 H 679 L 710 174" fill="none" stroke="#657389" stroke-width="2"/>
<path d="M 735 174 L 727 169 L 727 179 Z" fill="#657389"/>
<rect x="748" y="124" width="228" height="99" rx="10" fill="#f1f4f8" stroke="#dde3eb" stroke-width="1.2"/>
<text x="862" y="152" font-size="21" fill="#17283d" text-anchor="middle" font-weight="normal">总计算</text>
<text x="862" y="184" font-size="25" fill="#17283d" text-anchor="middle" font-weight="normal">20+20</text>
<text x="862" y="215" font-size="26" fill="#17283d" text-anchor="middle" font-weight="normal">=40卡·秒</text>
<text x="25" y="320" font-size="20" fill="#657389" text-anchor="start" font-weight="normal">教学示意：先除以各自的速率，再相加；不能给两路都用同一个除数。</text>
</svg>
