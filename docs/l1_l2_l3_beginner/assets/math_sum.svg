<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="math-sum" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="math_sum_title math_sum_desc">
<title id="math_sum_title">把每张卡的计算时间加起来（教学示意）</title>
<desc id="math_sum_desc">两张卡都观察10秒。卡1计算8秒、等待2秒；卡2计算4秒、等待6秒。计算合计12卡秒，所有卡可用时间共20卡秒，平均利用率为60%。 非仿真或实测结果。</desc>
<style>svg.math-sum text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect x="0" y="0" width="1000" height="320" rx="0" fill="white" stroke="none" stroke-width="1.2"/><text x="25" y="31" font-size="25" fill="#17283d" text-anchor="start" font-weight="bold">把每张卡的计算时间加起来</text><text x="974" y="30" font-size="19" fill="#657389" text-anchor="end" font-weight="normal">教学示意</text><rect x="154" y="48" width="19" height="18" rx="0" fill="#7c3aed" stroke="none" stroke-width="1.2"/>
<text x="183" y="64" font-size="18" fill="#17283d" text-anchor="start" font-weight="normal">计算</text>
<rect x="283" y="48" width="19" height="18" rx="0" fill="#df8426" stroke="none" stroke-width="1.2"/>
<text x="312" y="64" font-size="18" fill="#17283d" text-anchor="start" font-weight="normal">等待</text>
<text x="36" y="112" font-size="24" fill="#17283d" text-anchor="start" font-weight="normal">卡1</text>
<rect x="150" y="82" width="632.0" height="43" rx="0" fill="#7c3aed" stroke="none" stroke-width="1.2"/>
<rect x="782.0" y="82" width="158.0" height="43" rx="0" fill="#df8426" stroke="none" stroke-width="1.2"/>
<text x="466.0" y="111" font-size="22" fill="white" text-anchor="middle" font-weight="normal">计算8秒</text>
<text x="861.0" y="111" font-size="21" fill="white" text-anchor="middle" font-weight="normal">等待2秒</text>
<text x="36" y="181" font-size="24" fill="#17283d" text-anchor="start" font-weight="normal">卡2</text>
<rect x="150" y="151" width="316.0" height="43" rx="0" fill="#7c3aed" stroke="none" stroke-width="1.2"/>
<rect x="466.0" y="151" width="474.0" height="43" rx="0" fill="#df8426" stroke="none" stroke-width="1.2"/>
<text x="308.0" y="180" font-size="22" fill="white" text-anchor="middle" font-weight="normal">计算4秒</text>
<text x="703.0" y="180" font-size="21" fill="white" text-anchor="middle" font-weight="normal">等待6秒</text>
<line x1="150.0" y1="204" x2="150.0" y2="211" stroke="#657389" stroke-width="1"/>
<text x="150.0" y="232" font-size="18" fill="#657389" text-anchor="middle" font-weight="normal">0</text>
<line x1="308.0" y1="204" x2="308.0" y2="211" stroke="#657389" stroke-width="1"/>
<text x="308.0" y="232" font-size="18" fill="#657389" text-anchor="middle" font-weight="normal">2</text>
<line x1="466.0" y1="204" x2="466.0" y2="211" stroke="#657389" stroke-width="1"/>
<text x="466.0" y="232" font-size="18" fill="#657389" text-anchor="middle" font-weight="normal">4</text>
<line x1="624.0" y1="204" x2="624.0" y2="211" stroke="#657389" stroke-width="1"/>
<text x="624.0" y="232" font-size="18" fill="#657389" text-anchor="middle" font-weight="normal">6</text>
<line x1="782.0" y1="204" x2="782.0" y2="211" stroke="#657389" stroke-width="1"/>
<text x="782.0" y="232" font-size="18" fill="#657389" text-anchor="middle" font-weight="normal">8</text>
<line x1="940.0" y1="204" x2="940.0" y2="211" stroke="#657389" stroke-width="1"/>
<text x="940.0" y="232" font-size="18" fill="#657389" text-anchor="middle" font-weight="normal">10</text>
<text x="982" y="232" font-size="18" fill="#657389" text-anchor="end" font-weight="normal">秒</text>
<rect x="25" y="252" width="950" height="52" rx="8" fill="#f5f0ff" stroke="none" stroke-width="1.2"/>
<text x="46" y="286" font-size="23" fill="#17283d" text-anchor="start" font-weight="normal">总计算：8+4=12卡·秒</text>
<text x="516" y="286" font-size="23" fill="#7c3aed" text-anchor="start" font-weight="normal">整机平均：12÷(2×10)=60%</text>
</svg>
